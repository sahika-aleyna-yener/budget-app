<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BirikimAsistanı</title>
<meta name="theme-color" content="#F5F0FF">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS — Pastel Finance
═══════════════════════════════════════════ */
:root {
  --bg:       #F5F0FF;
  --bg2:      #FDFBFF;
  --bg3:      #EDE6FF;
  --card:     #FFFFFF;
  --card2:    #FAF7FF;
  --border:   #E2D9F3;
  --accent:   #9B84F7;
  --accent2:  #7B63E8;
  --green:    #2ECC8E;
  --yellow:   #F7B731;
  --red:      #F7657A;
  --blue:     #5BB8F7;
  --pink:     #F9A8D4;
  --lavender: #C4B5FD;
  --peach:    #FED7AA;
  --text:     #1E1A2E;
  --text2:    #6E6A8A;
  --text3:    #A9A4C0;
  --radius:   20px;
  --radius-s: 14px;
  --shadow:   0 4px 24px rgba(155,132,247,.12);
  --shadow-card: 0 2px 16px rgba(155,132,247,.10);
  --tab-h:    68px;
  --header-grad: linear-gradient(145deg,#C4B5FD 0%,#A78BFA 50%,#818CF8 100%);
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;overflow:hidden}
button{border:none;background:none;cursor:pointer;color:inherit;font:inherit}
input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
svg{display:block}
a{color:var(--accent);text-decoration:none}

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 calc(var(--tab-h) + 8px);}
#screen::-webkit-scrollbar{width:0}

/* ═══════════════════════════════════════════
   BOTTOM NAV — 5 tabs
═══════════════════════════════════════════ */
#nav{height:var(--tab-h);background:var(--card);border-top:1px solid var(--border);display:flex;align-items:stretch;position:relative;z-index:10;flex-shrink:0;box-shadow:0 -4px 20px rgba(155,132,247,.08)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;color:var(--text3);transition:.2s}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--accent)}
.nav-btn.active svg{stroke:var(--accent)}
.nav-btn .nav-pill{background:var(--bg3);border-radius:12px;padding:4px 12px;display:flex;flex-direction:column;align-items:center;gap:1px}
.nav-btn.active .nav-pill{background:linear-gradient(135deg,#EDE6FF,#DDD6FE)}

/* ═══════════════════════════════════════════
   CARDS & SECTIONS
═══════════════════════════════════════════ */
.section{padding:16px}
.section+.section{padding-top:0}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-card);border:1px solid rgba(226,217,243,.5)}
.card-sm{background:var(--card);border-radius:var(--radius-s);padding:12px;box-shadow:0 2px 8px rgba(155,132,247,.08);border:1px solid rgba(226,217,243,.5)}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:4px}
.spacer{flex:1}
.chip{background:var(--bg3);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--accent2)}
.chip-green{background:#DCFCE7;color:#15803D}
.chip-red{background:#FFE4E6;color:#BE123C}
.chip-yellow{background:#FEF3C7;color:#92400E}
.chip-blue{background:#DBEAFE;color:#1D4ED8}
.chip-pink{background:#FCE7F3;color:#9D174D}
.label{font-size:12px;color:var(--text2);font-weight:500}
.big{font-size:26px;font-weight:800;letter-spacing:-0.5px}
.med{font-size:18px;font-weight:700}
.sep{height:1px;background:var(--border);margin:12px 0}

/* ═══════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════ */
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:var(--radius-s);padding:12px 20px;font-weight:700;transition:.2s;text-align:center;display:inline-block;box-shadow:0 4px 16px rgba(155,132,247,.35)}
.btn:active{opacity:.9;transform:scale(.97)}
.btn-outline{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-s);padding:10px 16px;font-weight:600;transition:.2s;color:var(--text)}
.btn-outline:active{background:var(--bg3)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-block{display:block;width:100%}
.btn-green{background:linear-gradient(135deg,#34D399,#10B981);box-shadow:0 4px 16px rgba(52,211,153,.3)}
.btn-red{background:linear-gradient(135deg,#F87171,#EF4444);box-shadow:0 4px 16px rgba(248,113,113,.3)}
.btn-ghost{color:var(--accent);font-weight:700}

/* ═══════════════════════════════════════════
   INPUTS
═══════════════════════════════════════════ */
.input-wrap{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-s);padding:12px 14px;display:flex;align-items:center;gap:8px;transition:.2s}
.input-wrap:focus-within{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 4px rgba(155,132,247,.12)}
.input-wrap input,.input-wrap select{flex:1;background:none;width:100%}
.input-wrap select option{background:var(--card)}
.field-label{font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;font-size:11px}

/* ═══════════════════════════════════════════
   PROGRESS BARS
═══════════════════════════════════════════ */
.pbar-wrap{background:var(--bg3);border-radius:6px;height:8px;overflow:hidden}
.pbar-fill{height:100%;border-radius:6px;transition:.6s;background:linear-gradient(90deg,var(--accent),var(--lavender))}

/* ═══════════════════════════════════════════
   BADGES
═══════════════════════════════════════════ */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge-item{background:var(--card);border-radius:var(--radius-s);padding:14px 10px;text-align:center;transition:.2s;border:1.5px solid var(--border);box-shadow:var(--shadow-card)}
.badge-item.locked{opacity:.4;filter:grayscale(1)}
.badge-item:not(.locked){border-color:var(--lavender);background:linear-gradient(145deg,#fff,#F5F0FF)}
.badge-item .be{font-size:28px;margin-bottom:4px}
.badge-item .bn{font-size:11px;font-weight:700;color:var(--text)}
.badge-item .bd{font-size:10px;color:var(--text2);margin-top:2px}

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
#toast{position:fixed;bottom:calc(var(--tab-h)+16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;border-radius:14px;padding:10px 20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:.3s;white-space:nowrap;pointer-events:none;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══════════════════════════════════════════
   MODAL / BOTTOM SHEET
═══════════════════════════════════════════ */
#overlay{position:fixed;inset:0;background:rgba(100,70,200,.25);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center}
#overlay.open{display:flex}
#sheet{background:var(--card);border-radius:28px 28px 0 0;width:100%;max-width:480px;padding:20px;max-height:85vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(155,132,247,.2)}
#sheet::-webkit-scrollbar{width:0}
.sheet-handle{width:40px;height:5px;background:var(--border);border-radius:3px;margin:0 auto 16px}
.sheet-title{font-size:18px;font-weight:800;margin-bottom:16px}

/* ═══════════════════════════════════════════
   ONBOARDING
═══════════════════════════════════════════ */
#onboarding{position:fixed;inset:0;background:linear-gradient(160deg,#EDE6FF 0%,#F5F0FF 60%,#FCE7F3 100%);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
#onboarding h1{font-size:30px;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,#7C6AF7,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#onboarding p{color:var(--text2);margin-bottom:32px;font-size:15px;line-height:1.6}
.ob-char{font-size:80px;margin-bottom:16px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(155,132,247,.3))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ob-step{width:100%;max-width:360px}
.ob-steps{display:flex;gap:6px;justify-content:center;margin-bottom:28px}
.ob-dot{width:8px;height:8px;border-radius:4px;background:var(--border);transition:.3s}
.ob-dot.active{background:var(--accent);width:28px}

/* ═══════════════════════════════════════════
   CHARACTER BOX
═══════════════════════════════════════════ */
.char-box{background:linear-gradient(135deg,#F0EBFF,#FAF7FF);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;border:1.5px solid var(--lavender);box-shadow:0 4px 20px rgba(155,132,247,.12)}
.char-emoji{font-size:52px;line-height:1;filter:drop-shadow(0 4px 8px rgba(155,132,247,.2))}
.char-bubble{background:var(--card);border-radius:var(--radius-s);padding:10px 12px;font-size:13px;flex:1;position:relative;box-shadow:0 2px 8px rgba(155,132,247,.1);line-height:1.5}
.char-bubble::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);border:5px solid transparent;border-right-color:var(--card)}

/* ═══════════════════════════════════════════
   HOME HEADER
═══════════════════════════════════════════ */
.home-header{background:var(--header-grad);padding:24px 20px 28px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.home-header::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.home-header::after{content:'';position:absolute;bottom:-30px;left:20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.08)}
.home-name{font-size:13px;color:rgba(255,255,255,.8);font-weight:500;position:relative}
.home-amount{font-size:38px;font-weight:800;letter-spacing:-1.5px;margin:6px 0;color:#fff;position:relative;text-shadow:0 2px 8px rgba(0,0,0,.1)}
.home-sub{font-size:13px;color:rgba(255,255,255,.75);position:relative;font-weight:500}

/* ═══════════════════════════════════════════
   GOAL CIRCLE
═══════════════════════════════════════════ */
.goal-ring{display:flex;flex-direction:column;align-items:center;gap:8px}

/* ═══════════════════════════════════════════
   TABLE
═══════════════════════════════════════════ */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--text2);font-weight:700;padding:8px 10px;text-align:left;border-bottom:1.5px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:not(:last-child):hover td{background:var(--bg3);transition:.15s}
.tbl .skip{opacity:.4;text-decoration:line-through}

/* ═══════════════════════════════════════════
   CATEGORY LIST
═══════════════════════════════════════════ */
.cat-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-name{flex:1;font-size:13px}
.cat-pct{font-size:12px;color:var(--text2);min-width:36px;text-align:right}

/* ═══════════════════════════════════════════
   BLOG CARDS
═══════════════════════════════════════════ */
.blog-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.blog-scroll::-webkit-scrollbar{height:0}
.blog-card{flex-shrink:0;width:200px;background:linear-gradient(145deg,#fff,#F8F4FF);border-radius:var(--radius-s);padding:14px;cursor:pointer;border:1px solid var(--border);box-shadow:0 2px 12px rgba(155,132,247,.08);transition:.2s}
.blog-card:active{transform:scale(.97)}
.blog-card .bi{font-size:28px;margin-bottom:10px}
.blog-card .bt{font-size:13px;font-weight:700;margin-bottom:4px;line-height:1.4}
.blog-card .bs{font-size:11px;color:var(--text2);line-height:1.4}

/* ═══════════════════════════════════════════
   QUICK ADD FAB
═══════════════════════════════════════════ */
#fab{position:fixed;right:20px;bottom:calc(var(--tab-h)+16px);width:56px;height:56px;border-radius:28px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;z-index:50;box-shadow:0 6px 24px rgba(124,106,247,.5);transition:.2s}
#fab:active{transform:scale(.90)}

/* ═══════════════════════════════════════════
   AI CHAT
═══════════════════════════════════════════ */
.ai-msg{padding:12px 16px;border-radius:16px;font-size:13px;line-height:1.6;margin-bottom:8px;max-width:90%}
.ai-msg.ai{background:var(--card);border-bottom-left-radius:4px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(155,132,247,.08)}
.ai-msg.user{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;margin-left:auto;border-bottom-right-radius:4px;box-shadow:0 4px 12px rgba(155,132,247,.35)}
.ai-typing{display:flex;gap:5px;padding:12px 14px;background:var(--card);border-radius:16px;border-bottom-left-radius:4px;border:1px solid var(--border);max-width:80px}
.ai-typing span{width:7px;height:7px;border-radius:50%;background:var(--text3);animation:bounce .9s infinite}
.ai-typing span:nth-child(2){animation-delay:.15s}
.ai-typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* ═══════════════════════════════════════════
   WISH BASKET
═══════════════════════════════════════════ */
.wish-item{background:var(--card);border-radius:var(--radius-s);padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(155,132,247,.06)}
.wish-timer{font-size:11px;color:#D97706;font-weight:700;background:#FEF3C7;padding:2px 8px;border-radius:10px}

/* ═══════════════════════════════════════════
   SUBSCRIPTION
═══════════════════════════════════════════ */
.sub-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.sub-item:last-child{border-bottom:none}

/* ═══════════════════════════════════════════
   ACCORDION (Ayarlar)
═══════════════════════════════════════════ */
.acc-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:14px 16px;background:var(--card);border-radius:var(--radius);margin-bottom:4px;font-weight:700;user-select:none;transition:.2s;border:1px solid var(--border);box-shadow:var(--shadow-card)}
.acc-header:active{background:var(--bg3)}
.acc-header.open{border-radius:var(--radius) var(--radius) 0 0;margin-bottom:0}
.acc-header .acc-icon{transition:.3s;color:var(--text3);font-size:18px}
.acc-header.open .acc-icon{transform:rotate(180deg);color:var(--accent)}
.acc-body{background:var(--card);border-radius:0 0 var(--radius) var(--radius);padding:0 16px 16px;margin-bottom:8px;display:none;border-top:1px solid var(--border);border:1px solid var(--border);border-top:none}
.acc-body.open{display:block}

/* ═══════════════════════════════════════════
   SECTION TITLES & EXTRA UI
═══════════════════════════════════════════ */
.sec-title{font-size:17px;font-weight:800;margin-bottom:12px;color:var(--text)}
.stat-pill{background:var(--card);border-radius:var(--radius-s);padding:12px 14px;border:1px solid var(--border);box-shadow:var(--shadow-card)}
.stat-pill .sp-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-pill .sp-val{font-size:20px;font-weight:800}

/* ═══════════════════════════════════════════
   PLAN BARS
═══════════════════════════════════════════ */
.plan-bar-wrap{background:var(--bg3);border-radius:8px;height:10px;overflow:hidden}
.plan-bar-fill{height:100%;border-radius:8px;transition:.6s}

/* ═══════════════════════════════════════════
   SCROLL SHADOW HEADER SPACER
═══════════════════════════════════════════ */
.home-header-spacer{height:0;margin-bottom:16px}
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <!-- 5 tabs: home, harcama, plan, varlik, diger -->
  <nav id="nav">
    <button class="nav-btn active" data-tab="home" onclick="goTab('home')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Ana Sayfa
    </button>
    <button class="nav-btn" data-tab="harcama" onclick="goTab('harcama')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Harcama
    </button>
    <button class="nav-btn" data-tab="plan" onclick="goTab('plan')">
      <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      Plan
    </button>
    <button class="nav-btn" data-tab="varlik" onclick="goTab('varlik')">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
      Varlık
    </button>
    <button class="nav-btn" data-tab="diger" onclick="goTab('diger')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      Daha Fazla
    </button>
  </nav>
</div>

<!-- FAB -->
<button id="fab" onclick="openQuickAdd()">+</button>

<!-- Toast -->
<div id="toast"></div>

<!-- Bottom Sheet / Overlay -->
<div id="overlay" onclick="closeSheet(event)">
  <div id="sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<!-- Onboarding -->
<div id="onboarding">
  <div id="ob-inner"></div>
</div>

<script>
/* ═══════════════════════════════════════════
   XSS ESCAPE
═══════════════════════════════════════════ */
function escHTML(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
const KEY = 'ba_v3';
let S = {
  name: '',
  charStyle: '🦄',
  gelir: 0,
  giderZorunlu: 0,
  giderIstek: 0,
  hedefAd: 'Hedef',
  hedefTutar: 1000000,
  hedefEmoji: '🚗',
  banka: 'Alternatif Bank',
  faiz: 38,
  baslangic: 0,
  yazAylik: 30000,
  kisAylik: 20000,
  kykVar: false,
  kykBitis: 12,
  kykTutar: 4000,
  yasam: 'aile',
  harcamalar: [],
  varliklar: { mevduat: [], altin: [] },
  beklenenGelir: [],
  abonelikler: [],
  istekSepeti: [],
  rozetler: {},
  streak: 0,
  lastOpen: '',
  aiMessages: [],
  tablo: null,
  kartKesim: 10,
  kartLimit: 5000,
  kartGecenAy: 0,
};

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) S = { ...S, ...JSON.parse(raw) };
  } catch(e) {}
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
}

load();

/* ═══════════════════════════════════════════
   STREAK
═══════════════════════════════════════════ */
function updateStreak() {
  const today = todayStr();
  if (S.lastOpen === today) return;
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  if (S.lastOpen === yesterday) {
    S.streak = (S.streak || 0) + 1;
  } else if (S.lastOpen !== today) {
    S.streak = 1;
  }
  S.lastOpen = today;
  save();
  checkAllRozetler();
}

function todayStr() { return new Date().toISOString().slice(0,10); }

/* ═══════════════════════════════════════════
   FORMATTERS
═══════════════════════════════════════════ */
const TL = n => new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(n||0);
const NUM = n => new Intl.NumberFormat('tr-TR').format(n||0);

/* ═══════════════════════════════════════════
   SIMULATION ENGINE — saf nesne döndürür
═══════════════════════════════════════════ */
function simule({ aylikBirikimler, faiz, hedef, baslangic = 0 }) {
  const mF = faiz / 100 / 12;
  let b = baslangic;
  const adimlar = [];
  let hedefAy = null;

  for (let i = 0; i < aylikBirikimler.length; i++) {
    b = b * (1 + mF) + aylikBirikimler[i];
    adimlar.push({ ay: i + 1, bakiye: Math.round(b) });
    if (b >= hedef && hedefAy === null) {
      hedefAy = i + 1;
    }
  }
  if (hedefAy === null) {
    // Hedefe ulaşana kadar veya 240 aya kadar uzat
    for (let i = aylikBirikimler.length; i < 240; i++) {
      const avg = aylikBirikimler[aylikBirikimler.length - 1] || 20000;
      b = b * (1 + mF) + avg;
      adimlar.push({ ay: i + 1, bakiye: Math.round(b) });
      if (b >= hedef) { hedefAy = i + 1; break; }
    }
  }
  return { adimlar, hedefAy };
}

function tabloOlustur() {
  const YAZ = new Set([4,5,6,7]); // May Haz Tem Ağu (JS: 0=Ocak)
  return Array.from({ length: 60 }, (_, i) => {
    const mo = (new Date().getMonth() + i) % 12;
    let tutar = YAZ.has(mo) ? S.yazAylik : S.kisAylik;
    if (S.kykVar && i >= S.kykBitis) tutar = Math.max(0, tutar - S.kykTutar);
    return { tutar: Math.max(0, tutar), atladim: false, zamBuAy: null };
  });
}

function getTablo() {
  if (!S.tablo) S.tablo = tabloOlustur();
  return S.tablo;
}

function getAylikArr() {
  return getTablo().map(r => r.atladim ? 0 : r.tutar);
}

function hedefAySayisi() {
  if (!S.hedefTutar || S.hedefTutar <= 0) return null;
  const { hedefAy } = simule({ aylikBirikimler: getAylikArr(), faiz: S.faiz, hedef: S.hedefTutar, baslangic: S.baslangic });
  return hedefAy || null;
}

/* ═══════════════════════════════════════════
   FUTURE YIELD
═══════════════════════════════════════════ */
function futureYield(months) {
  const arr = getAylikArr().slice(0, months);
  while (arr.length < months) arr.push(arr[arr.length-1] || 20000);
  const { adimlar } = simule({ aylikBirikimler: arr, faiz: S.faiz, hedef: 999999999, baslangic: S.baslangic });
  return adimlar[months - 1]?.bakiye || 0;
}

/* ═══════════════════════════════════════════
   SVG CHARTS
═══════════════════════════════════════════ */
function drawDonut(svgEl, dataArr, r=80, cx=100, cy=100, sw=22) {
  if (!svgEl) return;
  svgEl.innerHTML = '';
  const total = dataArr.reduce((s,d)=>s+d.val,0);
  if (total === 0) {
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',r);
    c.setAttribute('fill','none'); c.setAttribute('stroke','#2E2E48'); c.setAttribute('stroke-width',sw);
    svgEl.appendChild(c);
    return;
  }
  const circ = 2 * Math.PI * r;
  let offset = -circ * 0.25;
  dataArr.forEach(d => {
    const len = (d.val / total) * circ;
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',r);
    c.setAttribute('fill','none'); c.setAttribute('stroke',d.color); c.setAttribute('stroke-width',sw);
    c.setAttribute('stroke-dasharray',`${len} ${circ-len}`);
    c.setAttribute('stroke-dashoffset',offset);
    c.setAttribute('stroke-linecap','round');
    offset -= len;
    svgEl.appendChild(c);
  });
}

function drawLine(svgEl, series, h=120, w=300) {
  if (!svgEl) return;
  svgEl.innerHTML = '';
  if (!series.length || !series[0].points.length) return;
  const pts = series[0].points;
  const maxY = Math.max(...series.flatMap(s=>s.points));
  const minY = Math.min(...series.flatMap(s=>s.points));
  const rng = maxY - minY || 1;
  const pad = 10;
  function scaleX(i) { return pad + (i/(pts.length-1||1))*(w-2*pad); }
  function scaleY(v) { return pad + (1-(v-minY)/rng)*(h-2*pad); }
  series.forEach(s => {
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    let d = `M${scaleX(0)},${scaleY(s.points[0])}`;
    for (let i=1;i<s.points.length;i++) {
      const x1=scaleX(i-0.5), y1=scaleY(s.points[i-1]);
      const x2=scaleX(i-0.5), y2=scaleY(s.points[i]);
      d += ` C${x1},${y1} ${x2},${y2} ${scaleX(i)},${scaleY(s.points[i])}`;
    }
    path.setAttribute('d',d); path.setAttribute('fill','none');
    path.setAttribute('stroke',s.color||'#7C6AF7'); path.setAttribute('stroke-width','2.5');
    path.setAttribute('stroke-linecap','round');
    svgEl.appendChild(path);
    const area = document.createElementNS('http://www.w3.org/2000/svg','path');
    area.setAttribute('d', d + ` L${scaleX(s.points.length-1)},${h-pad} L${scaleX(0)},${h-pad} Z`);
    area.setAttribute('fill',s.color||'#7C6AF7'); area.setAttribute('opacity','0.08');
    svgEl.insertBefore(area, path);
  });
}

function drawCircular(svgEl, pct, color='#7C6AF7', r=36, cx=42, cy=42, sw=7) {
  if (!svgEl) return;
  svgEl.innerHTML = '';
  const circ = 2*Math.PI*r;
  const bg = document.createElementNS('http://www.w3.org/2000/svg','circle');
  bg.setAttribute('cx',cx);bg.setAttribute('cy',cy);bg.setAttribute('r',r);
  bg.setAttribute('fill','none');bg.setAttribute('stroke','#2E2E48');bg.setAttribute('stroke-width',sw);
  svgEl.appendChild(bg);
  const fg = document.createElementNS('http://www.w3.org/2000/svg','circle');
  fg.setAttribute('cx',cx);fg.setAttribute('cy',cy);fg.setAttribute('r',r);
  fg.setAttribute('fill','none');fg.setAttribute('stroke',color);fg.setAttribute('stroke-width',sw);
  fg.setAttribute('stroke-dasharray',`${(pct/100)*circ} ${circ}`);
  fg.setAttribute('stroke-dashoffset',`${circ*0.25}`);
  fg.setAttribute('stroke-linecap','round');
  svgEl.appendChild(fg);
}

  'kafe':['kahve','çay','starbucks','kafe','cafe','latte','cappuccino'],

  'sağlık':['eczane','ilaç','doktor','hastane','spor','gym'],
  'eğitim':['kitap','kurs','udemy','ders'],
  'diğer':[]
};
const CAT_COLORS = {
  'yemek':'#F87171','kafe':'#FBBF24','ulaşım':'#60A5FA',
  'market':'#34D399','eğlence':'#A78BFA','sağlık':'#FB923C',
  'eğitim':'#2DD4BF','diğer':'#A3A3C2'
};
// Pastel chip bg/text for categories
const CAT_CHIPS = {
  'yemek':['#FFE4E6','#9F1239'],'kafe':['#FEF3C7','#78350F'],
  'ulaşım':['#DBEAFE','#1E40AF'],'market':['#DCFCE7','#14532D'],
  'eğlence':['#EDE9FE','#5B21B6'],'sağlık':['#FED7AA','#7C2D12'],
  'eğitim':['#CCFBF1','#134E4A'],'diğer':['#E5E7EB','#374151']
};

function guessCat(text) {
  const t = text.toLowerCase();
  for (const [cat, keys] of Object.entries(CATKEYS)) {
    if (keys.some(k => t.includes(k))) return cat;
  }
  return 'diğer';
}

function parseNLP(text) {
  const result = [];
  const re = /([a-züğışöçA-ZÜĞİŞÖÇ][a-züğışöçA-ZÜĞİŞÖÇ\s]*?)\s*[:=]?\s*(\d+[\.,]?\d*)/gi;
  let m;
  while ((m = re.exec(text)) !== null) {
    const ad = m[1].trim();
    const tutar = parseFloat(m[2].replace(',','.'));
    if (ad && tutar > 0) {
      result.push({ ad, tutar, kategori: guessCat(ad) });
    }
  }
  return result;
}

const CAT_EMOJI = {
  yemek:'🍔', kafe:'☕', ulaşım:'🚌', market:'🛒',
  eğlence:'🎮', sağlık:'💊', eğitim:'📚', diğer:'💸'

function simulateCut(kat) {
  const monthHarc = S.harcamalar.filter(h=>h.tarih.startsWith(todayStr().slice(0,7)));
  const katTutar = monthHarc.filter(h=>h.kategori===kat).reduce((s,h)=>s+h.tutar,0);
  if (!katTutar) return;
  const hedefAySavings = hedefAySayisi();
  const newArr = getAylikArr().map(v => v + katTutar);
  const { hedefAy: newHay } = simule({ aylikBirikimler: newArr, faiz: S.faiz, hedef: S.hedefTutar, baslangic: S.baslangic });
  const diff = hedefAySavings && newHay ? hedefAySavings - newHay : null;

  // Yaşam düzenine göre mesaj
  const yasamNote = {
    aile: 'Aile ortamında kesmesi en kolay kategori.',
    kyk: 'KYK döneminde küçük kesintiler büyük fark yaratır.',
    kira: 'Kira yükü ağırken bu tasarruf gerçekten sayılır.',
    aile_sorumlu: 'Her TL önemli — bu adım çok değerli.',
  }[S.yasam] || '';

  document.getElementById('cut-result').innerHTML = `
    <div class="card-sm" style="background:var(--bg);margin-top:8px">
      <div style="color:var(--text2);font-size:13px">${escHTML(kat)} harcamalarını kessen (<strong>${TL(katTutar)}/ay</strong>):</div>
      ${diff ? `<div style="color:var(--green);font-weight:700;margin-top:4px">🎯 Hedefe ${diff} ay daha erken ulaşırsın!</div>` : '<div style="color:var(--text2);font-size:13px;margin-top:4px">Hesaplanamadı</div>'}
      <div style="color:var(--text2);font-size:12px;margin-top:4px">Kendini suçlu hissetme — küçük adımlar da değerli 💪</div>
      ${yasamNote ? `<div style="color:var(--accent);font-size:12px;margin-top:2px">${escHTML(yasamNote)}</div>` : ''}
    </div>
  `;
}

function calcEmek() {
  const tutar = parseFloat(document.getElementById('emek-tutar').value)||0;
  const saatUcret = S.gelir > 0 ? S.gelir / (22*8) : 0;
  if (!saatUcret || !tutar) return;
  const saat = tutar / saatUcret;
  const gun = saat / 8;
  document.getElementById('emek-result').innerHTML =
    `Bu harcama: <strong style="color:var(--yellow)">${saat.toFixed(1)} saat</strong> (${gun.toFixed(1)} gün emeğin)`;
}

  S.harcamalar.splice(i, 1); save(); renderHarcama();

function saveWish() {

function dailyLimit() {
  const today = new Date();
  const gun = today.getDate();
  const kesim = S.kartKesim;
  const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  // Kesim günü geçtiyse: ayın kalanı + bir sonraki aydaki kesim günü
  const kalan = gun <= kesim ? kesim - gun : (daysInMonth - gun) + kesim;
  const gunSayisi = Math.max(1, kalan);
  return Math.round(Math.max(0, S.kartLimit - S.kartGecenAy) / gunSayisi);
}

function todaySpent() {
  return S.harcamalar.filter(h=>h.tarih===todayStr()).reduce((s,h)=>s+h.tutar,0);
}

function altinAutoCalc() {
  const tur = document.getElementById('al-tur')?.value || 'Gram';
  const adet = parseFloat(document.getElementById('al-adet')?.value) || 0;
  const guncelGram = parseFloat(document.getElementById('al-guncel')?.value) || 0;
  const gramAgirligi = GRAM_WEIGHTS[tur] || 1;
  const tutar = adet * gramAgirligi * guncelGram;
  const tutarEl = document.getElementById('al-tutar');
  if (tutarEl) tutarEl.value = Math.round(tutar) || '';
}

function saveAltin() {
  const tur = document.getElementById('al-tur').value;
  const adet = parseInt(document.getElementById('al-adet').value)||1;
  const alisGram = parseFloat(document.getElementById('al-alis').value)||0;
  const guncelGram = parseFloat(document.getElementById('al-guncel').value)||0;
  // FIX: auto-calculate tutar from gram weight
  const gramAgirligi = GRAM_WEIGHTS[tur] || 1;
  const tutar = guncelGram > 0
    ? Math.round(adet * gramAgirligi * guncelGram)
    : parseFloat(document.getElementById('al-tutar').value) || 0;
  S.varliklar.altin.push({ tur, adet, alisGram, guncelGram, tutar });
  save(); closeSheetDirect(); renderVarlik();
  toast('Altın eklendi');
}

function openAI() {
  const pct = S.hedefTutar > 0 ? Math.round(S.baslangic / S.hedefTutar * 100) : 0;
  const hayAy = hedefAySayisi();
  const context = `Kullanıcı profili: Aylık gelir ${TL(S.gelir)}, aylık birikim ${TL(S.kisAylik)}, hedef: ${S.hedefAd} (${TL(S.hedefTutar)}), mevcut birikim ${TL(S.baslangic)} (${pct}%), tahmini ${hayAy ? hayAy + '. ayda' : '?'} hedefe ulaşacak, banka: ${S.banka} (${S.faiz}% faiz), yaşam düzeni: ${S.yasam}.`;
  // Context'i closure ile sendAI'ya geç (global window._aiCtx yerine)
  const boundSend = () => sendAI(context);
  window._sendAI = boundSend;

  openSheet(`
    <div class="sheet-title">🤖 AI Finans Koçu</div>
    <div id="ai-messages" style="max-height:40vh;overflow-y:auto;margin-bottom:12px">
      ${S.aiMessages.length === 0 ? `
        <div class="ai-msg ai">Merhaba${S.name ? ' ' + escHTML(S.name) : ''}! Ben senin finans koçunım 🎯 Birikim planın, harcamalar veya hedefler hakkında konuşabiliriz. Ne sormak istersin?</div>
      ` : S.aiMessages.map(m=>`<div class="ai-msg ${m.role === 'user' ? 'user' : 'ai'}">${escHTML(m.content)}</div>`).join('')}
    </div>
    <div class="row" style="gap:8px">
      <div class="input-wrap" style="flex:1"><input id="ai-input" placeholder="Bir şey sor..." onkeydown="if(event.key==='Enter') window._sendAI && window._sendAI()"></div>
      <button class="btn" onclick="window._sendAI && window._sendAI()">→</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
      ${['Harcamalarımı analiz et','Ne kadar tasarruf etmeliyim?','Hedefime daha hızlı nasıl ulaşırım?'].map(q=>`
        <button class="chip" style="cursor:pointer" onclick="document.getElementById('ai-input').value='${escHTML(q)}'">${escHTML(q)}</button>
      `).join('')}
    </div>
  `);
  // boundSend yukarıda tanımlandı
  setTimeout(()=>{
    const msgs = document.getElementById('ai-messages');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
  }, 100);
}

async function sendAI(ctx) {
  if (!S.apiKey) { toast('Ayarlar\'dan API anahtarını gir'); return; }
  const input = document.getElementById('ai-input');
  const msg = input.value.trim();
  if (!msg) return;
  ctx = ctx || '';
  input.value = '';
  S.aiMessages.push({ role:'user', content: msg });
  const msgs = document.getElementById('ai-messages');
  // XSS safe insertion
  const userDiv = document.createElement('div');
  userDiv.className = 'ai-msg user';
  userDiv.textContent = msg;
  const typingDiv = document.createElement('div');
  typingDiv.className = 'ai-msg ai ai-typing';
  typingDiv.innerHTML = '<span></span><span></span><span></span>';
  msgs.appendChild(userDiv);
  msgs.appendChild(typingDiv);
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': S.apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 400,
        system: `Sen BirikimAsistanı uygulamasının Türkçe finans koçusun. Empati kur, suçluluk hissettirme, motive et. ${ctx}`,
        messages: S.aiMessages.map(m=>({role:m.role, content:m.content}))
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Üzgünüm, yanıt alınamadı.';
    S.aiMessages.push({ role:'assistant', content: reply });
    save();
    // XSS safe
    const replyDiv = document.createElement('div');
    replyDiv.className = 'ai-msg ai';
    replyDiv.textContent = reply;
    typingDiv.replaceWith(replyDiv);
    msgs.scrollTop = msgs.scrollHeight;
  } catch(e) {
    const errDiv = document.createElement('div');
    errDiv.className = 'ai-msg ai';
    errDiv.style.color = 'var(--red)';
    errDiv.textContent = 'Bağlantı hatası. API anahtarını kontrol et.';
    typingDiv.replaceWith(errDiv);
  }
}

      <div class="field-label">Aylık birikim hedefin (TL)</div>
      <div class="input-wrap"><input id="ob-birikim" type="number" placeholder="20000"></div>
    `
  }
];

function renderOnboarding() {
  const step = OB_STEPS[obStep];
  const dots = OB_STEPS.map((_,i)=>`<div class="ob-dot ${i===obStep?'active':''}"></div>`).join('');
  document.getElementById('ob-inner').innerHTML = `
    <div class="ob-char">${step.char}</div>
    <h1>${escHTML(step.title)}</h1>
    <p>${escHTML(step.desc)}</p>
    <div class="ob-steps">${dots}</div>
    <div class="ob-step">
      ${step.content}
      <button class="btn btn-block" style="margin-top:16px" onclick="obNext()">
        ${obStep < OB_STEPS.length - 1 ? 'Devam →' : 'Başlayalım! 🚀'}
      </button>
      ${obStep > 0 ? `<button class="btn-ghost" style="margin-top:8px;display:block;width:100%;text-align:center" onclick="obBack()">← Geri</button>` : ''}
      <button class="btn-outline btn-block" style="margin-top:8px;color:var(--text2)" onclick="skipOnboarding()">Şimdilik Atla →</button>
    </div>
  `;
  setTimeout(()=>{
    const inp = document.querySelector('#ob-inner input');
    if (inp) inp.focus();
  }, 100);
}

function obNext() {
  if (obStep === 0) {
    // Ad isteğe bağlı — boş bırakılabilir
    S.name = document.getElementById('ob-name').value.trim();
  } else if (obStep === 1) {
    S.gelir = parseFloat(document.getElementById('ob-gelir').value)||0;
    S.yasam = document.getElementById('ob-yasam').value;
  } else if (obStep === 2) {
    S.hedefAd = document.getElementById('ob-had').value.trim() || 'Hedef';
    S.hedefTutar = parseFloat(document.getElementById('ob-htutar').value)||1000000;
    const birikim = parseFloat(document.getElementById('ob-birikim').value)||20000;
    S.kisAylik = birikim;
    S.yazAylik = Math.round(birikim * 1.3);
    S.tablo = null;
  }
  if (obStep < OB_STEPS.length - 1) {
    obStep++;
    renderOnboarding();
  } else {
    finishOnboarding();
  }
}

function skipOnboarding() {
  // Ad atlanabilir — 'Kullanıcı' default değil, boş da olabilir
  finishOnboarding();
}

function finishOnboarding() {
  save();
  document.getElementById('onboarding').style.display = 'none';
  updateStreak();
  renderTab('home');
  if (S.name) toast(`Hoş geldin, ${escHTML(S.name)}! 🎉`);
  else toast('BirikimAsistanı\'na hoş geldin! 🎉');
}

function obBack() { if (obStep > 0) { obStep--; renderOnboarding(); } }
